<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly: Ruda Śląska Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      grid-template-rows: repeat(11, minmax(0, 1fr));
      aspect-ratio: 1 / 1;
      max-width: 850px;
      margin: auto;
    }
    .tile-brown { border-top: 4px solid #78350f; }
    .tile-lightblue { border-top: 4px solid #38bdf8; }
    .tile-pink { border-top: 4px solid #f43f5e; }
    .tile-orange { border-top: 4px solid #fb923c; }
    .tile-red { border-top: 4px solid #ef4444; }
    .tile-yellow { border-top: 4px solid #facc15; }
    .tile-green { border-top: 4px solid #22c55e; }
    .tile-darkblue { border-top: 4px solid #1e3a8a; }
    .tile-transport { border-top: 4px solid #64748b; }
    .tile-utility { border-top: 4px solid #a855f7; }
    .tile-special { border-top: 4px solid #94a3b8; }
  </style>
</head>
<body class="p-2 md:p-6 min-h-screen flex flex-col items-center">

  <!-- NAGŁÓWEK -->
  <header class="text-center mb-4">
    <h1 class="text-3xl font-extrabold text-amber-500 tracking-wide">MONOPOLY: RUDA ŚLĄSKA</h1>
    <p class="text-sm text-slate-400">Graj online, kupuj dzielnice, stawiaj familoki i handluj bez oszukiwania!</p>
  </header>

  <!-- FORMULARZ WEJŚCIA DO POKOJU -->
  <div id="setup-card" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl max-w-md w-full mb-6">
    <h2 class="text-xl font-bold mb-4 text-amber-400">🎮 Pokój Gry Online</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Twój Nick</label>
        <input id="input-player-name" type="text" value="Górnik_1" class="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-amber-300 font-bold focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Kod Pokoju</label>
        <input id="input-room-code" type="text" value="RUDA1" class="w-full p-2.5 rounded bg-slate-900 border border-slate-700 text-amber-300 font-bold uppercase focus:outline-none focus:border-amber-500">
      </div>
      <button onclick="joinRoom()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 font-bold rounded-lg text-slate-950 transition shadow-lg">
        Dołącz / Stwórz Pokój
      </button>
    </div>
  </div>

  <!-- POCZEKALNIA (LOBBY) -->
  <div id="lobby-waiting-area" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl max-w-md w-full mb-6 text-center">
    <div id="room-code-badge" class="mb-3 inline-block px-3 py-1 bg-amber-500/20 border border-amber-500/40 rounded-full text-amber-400 font-mono text-sm">
      Pokój: <span id="display-room-code" class="font-bold"></span>
    </div>
    <h3 class="text-lg font-bold text-slate-200 mb-2">Gracze w pokoju:</h3>
    <div id="lobby-players-list" class="space-y-2 mb-4"></div>
    <button id="btn-start-game" onclick="startOnlineGame()" class="hidden w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition shadow-lg">
      🚀 Rozpocznij Grać
    </button>
  </div>

  <!-- GŁÓWNA PLANSZA I PANEL GRY -->
  <div id="game-main-area" class="hidden w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- LEFT PANEL: GRACZE I STEROWANIE -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-between space-y-4">
      <div>
        <h3 class="text-lg font-bold text-amber-400 mb-3 border-b border-slate-700 pb-2">Status Graczy</h3>
        <div id="players-status-list" class="space-y-2 mb-4"></div>
      </div>

      <!-- KONTROLA TURY -->
      <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
        <div id="turn-indicator" class="text-sm font-bold text-amber-400 mb-2">Oczekiwanie na turę...</div>
        <div class="flex justify-center gap-2 mb-3">
          <button onclick="rollDice()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded shadow">
            🎲 Rzuć Kośćmi
          </button>
          <button onclick="endTurn()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold rounded">
            ⏭️ Zakończ Turę
          </button>
        </div>
        <div id="dice-result" class="text-xs text-slate-400 font-mono mb-2">Wynik rzutu: -</div>
        <div id="action-buttons-area" class="flex flex-col gap-2"></div>
      </div>
    </div>

    <!-- CENTER: PLANSZA GRAFICZNA -->
    <div class="lg:col-span-2 bg-slate-900 p-2 rounded-xl border border-slate-700 flex items-center justify-center">
      <div id="board-container" class="board-grid w-full bg-slate-950 p-1 gap-1 text-[10px] text-center">
        <!-- Renderowanie planszy przez JS -->
      </div>
    </div>

    <!-- LOGI ZDARZEŃ -->
    <div class="lg:col-span-3 bg-slate-800 p-4 rounded-xl border border-slate-700">
      <h4 class="text-sm font-bold text-slate-400 mb-2">Dziennik Zdarzeń:</h4>
      <div id="game-logs" class="h-28 overflow-y-auto bg-slate-900 p-2 rounded text-xs font-mono text-slate-300 space-y-1"></div>
    </div>
  </div>

  <!-- SCRIPT Z LOGIKĄ GRAFICZNĄ I BEZPOŚREDNIMI DEKLARACJAMI -->
  <script>
    var roomCode = null;
    var localPlayerId = 'usr_' + Math.random().toString(36).substring(2, 9);
    var syncChannel = null;

    var AVATARS = [
      { name: "Szyb Górniczy", emoji: "🏗️" },
      { name: "Kogut Ruda", emoji: "🐓" },
      { name: "Węglarka", emoji: "🚃" },
      { name: "Kask Górniczy", emoji: "🪖" }
    ];

    var BOARD_FIELDS = [
      { id: 0, name: "START", group: "special", price: 0, rent: 0 },
      { id: 1, name: "Kochłowice - Rynek", group: "brown", price: 60, rent: 10 },
      { id: 2, name: "Karta Górnicza", group: "special", price: 0, rent: 0 },
      { id: 3, name: "Sanktuarium MB", group: "brown", price: 60, rent: 12 },
      { id: 4, name: "Podatek od Śmieci", group: "special", price: 0, rent: 0 },
      { id: 5, name: "Tramwaj 9", group: "transport", price: 200, rent: 25 },
      { id: 6, name: "Orzegów - Park", group: "lightblue", price: 100, rent: 14 },
      { id: 7, name: "Karta Górnicza", group: "special", price: 0, rent: 0 },
      { id: 8, name: "Koksownia Orzegów", group: "lightblue", price: 100, rent: 14 },
      { id: 9, name: "Muzeum Chleba", group: "lightblue", price: 120, rent: 16 },
      { id: 10, name: "Areszt", group: "special", price: 0, rent: 0 },
      { id: 11, name: "Bykowina - Górka", group: "pink", price: 140, rent: 18 },
      { id: 12, name: "Wodociągi Rudzkie", group: "utility", price: 150, rent: 20 },
      { id: 13, name: "Bykowina - Osiedle", group: "pink", price: 140, rent: 18 },
      { id: 14, name: "Stara Kuźnia", group: "pink", price: 160, rent: 20 },
      { id: 15, name: "Dworzec PKP Ruda", group: "transport", price: 200, rent: 25 },
      { id: 16, name: "Bielszowice - Kopalnia", group: "orange", price: 180, rent: 22 },
      { id: 17, name: "Karta Górnicza", group: "special", price: 0, rent: 0 },
      { id: 18, name: "Park Strzelnica", group: "orange", price: 180, rent: 22 },
      { id: 19, name: "Dom Kultury Bielszowice", group: "orange", price: 200, rent: 24 },
      { id: 20, name: "Bezpłatny Parking", group: "special", price: 0, rent: 0 },
      { id: 21, name: "Elektrownia Halemba", group: "red", price: 220, rent: 26 },
      { id: 22, name: "Karta Górnicza", group: "special", price: 0, rent: 0 },
      { id: 23, name: "Aquadrom Halemba", group: "red", price: 220, rent: 26 },
      { id: 24, name: "Szlak Miejski Halemba", group: "red", price: 240, rent: 28 },
      { id: 25, name: "Autobus M1", group: "transport", price: 200, rent: 25 },
      { id: 26, name: "Wirek - Ficinus", group: "yellow", price: 260, rent: 30 },
      { id: 27, name: "C.H. Plaza Wirek", group: "yellow", price: 260, rent: 30 },
      { id: 28, name: "Zakład Energetyczny", group: "utility", price: 150, rent: 20 },
      { id: 29, name: "Wieża Ciśnień Wirek", group: "yellow", price: 280, rent: 32 },
      { id: 30, name: "Idziesz do Aresztu", group: "special", price: 0, rent: 0 },
      { id: 31, name: "Godula - Szpital", group: "green", price: 300, rent: 35 },
      { id: 32, name: "Park Dworski Godula", group: "green", price: 300, rent: 35 },
      { id: 33, name: "Karta Górnicza", group: "special", price: 0, rent: 0 },
      { id: 34, name: "Plac Niepodległości", group: "green", price: 320, rent: 40 },
      { id: 35, name: "DTŚ Ruda Śląska", group: "transport", price: 200, rent: 25 },
      { id: 36, name: "Karta Górnicza", group: "special", price: 0, rent: 0 },
      { id: 37, name: "Dworzec Chebzie", group: "darkblue", price: 350, rent: 50 },
      { id: 38, name: "Kasa Zapomogowa", group: "special", price: 0, rent: 0 },
      { id: 39, name: "Wielki Piec Pokój", group: "darkblue", price: 400, rent: 70 }
    ];

    var gameState = {
      status: 'waiting',
      hostId: null,
      currentPlayerIndex: 0,
      diceRolled: false,
      lastDice: [1, 1],
      properties: {},
      players: [],
      logs: []
    };

    function initBoardDOM() {
      var container = document.getElementById('board-container');
      if (!container) return;

      container.innerHTML = BOARD_FIELDS.map(function(f) {
        return `
          <div id="tile-${f.id}" class="bg-slate-800 p-1 rounded border border-slate-700 flex flex-col justify-between tile-${f.group} relative min-h-[50px]">
            <div class="flex justify-between items-center text-[8px]">
              <span class="font-extrabold text-slate-300 leading-tight">${f.name}</span>
              <span class="text-amber-400">#${f.id}</span>
            </div>
            <div id="tile-owner-${f.id}" class="text-[8px] text-amber-300 font-bold"></div>
            <div id="tile-players-${f.id}" class="flex flex-wrap gap-1 justify-center my-0.5"></div>
            <div class="text-[8px] text-slate-400">${f.price ? f.price + 'zł' : ''}</div>
          </div>
        `;
      }).join('');
    }

    function renderGameState() {
      var setupCard = document.getElementById('setup-card');
      var lobbyArea = document.getElementById('lobby-waiting-area');
      var gameArea = document.getElementById('game-main-area');

      if (gameState.status === 'playing') {
        if (setupCard) setupCard.classList.add('hidden');
        if (lobbyArea) lobbyArea.classList.add('hidden');
        if (gameArea) gameArea.classList.remove('hidden');
      } else {
        if (gameState.players.length > 0) {
          if (setupCard) setupCard.classList.add('hidden');
          if (lobbyArea) lobbyArea.classList.remove('hidden');
        }
        if (gameArea) gameArea.classList.add('hidden');
      }

      var playerList = document.getElementById('lobby-players-list');
      if (playerList) {
        playerList.innerHTML = gameState.players.map(function(p) {
          return `
            <div class="flex items-center justify-between p-2.5 bg-slate-900 rounded border border-slate-700">
              <span class="font-bold text-amber-400">${p.avatar ? p.avatar.emoji : '👤'} ${p.name}</span>
              <span class="text-xs text-slate-400">${p.id === gameState.hostId ? '👑 Gospodarz' : 'Gracz'}</span>
            </div>
          `;
        }).join('');
      }

      var startBtn = document.getElementById('btn-start-game');
      if (startBtn) {
        if (gameState.hostId === localPlayerId && gameState.status === 'waiting') {
          startBtn.classList.remove('hidden');
        } else {
          startBtn.classList.add('hidden');
        }
      }

      var statusList = document.getElementById('players-status-list');
      if (statusList) {
        statusList.innerHTML = gameState.players.map(function(p, idx) {
          return `
            <div class="p-2 rounded bg-slate-900 border ${idx === gameState.currentPlayerIndex ? 'border-amber-500' : 'border-slate-800'}">
              <div class="flex justify-between font-bold text-xs text-amber-300">
                <span>${p.avatar ? p.avatar.emoji : '👤'} ${p.name}</span>
                <span>${p.money} PLN</span>
              </div>
              <div class="text-[10px] text-slate-400 mt-1">Pozycja: Pole #${p.position}</div>
            </div>
          `;
        }).join('');
      }

      var logsBox = document.getElementById('game-logs');
      if (logsBox) {
        logsBox.innerHTML = gameState.logs.map(function(l) { return `<div>${l}</div>`; }).reverse().join('');
      }

      var diceRes = document.getElementById('dice-result');
      if (diceRes && gameState.lastDice) {
        diceRes.innerText = `Wynik rzutu: ${gameState.lastDice[0]} + ${gameState.lastDice[1]} = ${gameState.lastDice[0] + gameState.lastDice[1]}`;
      }

      var curr = gameState.players[gameState.currentPlayerIndex];
      var turnInd = document.getElementById('turn-indicator');
      if (turnInd && curr) {
        turnInd.innerText = curr.id === localPlayerId ? "👉 TWOJA TURA!" : `Czeka na gracza: ${curr.name}`;
      }

      BOARD_FIELDS.forEach(function(f) {
        var ownerEl = document.getElementById(`tile-owner-${f.id}`);
        var playersEl = document.getElementById(`tile-players-${f.id}`);

        if (ownerEl) {
          var prop = gameState.properties ? gameState.properties[f.id] : null;
          if (prop && prop.owner) {
            var ownerPlayer = gameState.players.find(function(p) { return p.id === prop.owner; });
            ownerEl.innerText = ownerPlayer ? (ownerPlayer.avatar ? ownerPlayer.avatar.emoji : '🏠') : '';
          } else {
            ownerEl.innerText = '';
          }
        }

        if (playersEl) {
          var presentPlayers = gameState.players.filter(function(p) { return p.position === f.id; });
          playersEl.innerHTML = presentPlayers.map(function(p) {
            return `<span title="${p.name}">${p.avatar ? p.avatar.emoji : '👤'}</span>`;
          }).join('');
        }
      });

      renderActionButtons();
    }

    function renderActionButtons() {
      var area = document.getElementById('action-buttons-area');
      if (!area) return;
      area.innerHTML = '';

      var curr = gameState.players[gameState.currentPlayerIndex];
      if (!curr || curr.id !== localPlayerId || !gameState.diceRolled) return;

      var currentTile = BOARD_FIELDS[curr.position];
      if (!currentTile || currentTile.group === 'special') return;

      var prop = gameState.properties[currentTile.id];
      if (!prop) {
        if (curr.money >= currentTile.price) {
          area.innerHTML = `<button onclick="buyCurrentTile()" class="w-full py-2 bg-green-600 hover:bg-green-500 font-bold text-xs text-white rounded">Kup ${currentTile.name} (${currentTile.price}zł)</button>`;
        }
      } else if (prop.owner === curr.id) {
        area.innerHTML = `<button onclick="upgradeCurrentTile()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white rounded">Rozbuduj dzielnicę (${currentTile.price / 2}zł)</button>`;
      }
    }

    function pushRoomState() {
      if (!roomCode) return;
      localStorage.setItem(`monopoly_room_${roomCode}`, JSON.stringify(gameState));
      if (syncChannel) syncChannel.postMessage(gameState);
    }

    function joinRoom() {
      var nameInput = document.getElementById('input-player-name').value.trim();
      var codeInput = document.getElementById('input-room-code').value.trim().toUpperCase();

      if (!nameInput || !codeInput) {
        alert("Wpisz nick i kod pokoju!");
        return;
      }

      roomCode = codeInput;
      document.getElementById('display-room-code').innerText = roomCode;

      syncChannel = new BroadcastChannel(`room_${roomCode}`);
      syncChannel.onmessage = function(event) {
        gameState = event.data;
        renderGameState();
      };

      var existingRoomData = localStorage.getItem(`monopoly_room_${roomCode}`);

      if (!existingRoomData) {
        gameState = {
          status: 'waiting',
          hostId: localPlayerId,
          currentPlayerIndex: 0,
          diceRolled: false,
          lastDice: [1, 1],
          properties: {},
          players: [{
            id: localPlayerId,
            name: nameInput,
            money: 1500,
            position: 0,
            avatar: AVATARS[0]
          }],
          logs: [`🎮 Utworzono pokój ${roomCode} przez ${nameInput}.`]
        };
        pushRoomState();
      } else {
        gameState = JSON.parse(existingRoomData);
        var playerExists = gameState.players.find(function(p) { return p.id === localPlayerId || p.name === nameInput; });
        if (!playerExists) {
          gameState.players.push({
            id: localPlayerId,
            name: nameInput,
            money: 1500,
            position: 0,
            avatar: AVATARS[gameState.players.length % AVATARS.length]
          });
          gameState.logs.push(`👋 ${nameInput} dołączył do pokoju.`);
          pushRoomState();
        }
      }

      renderGameState();
    }

    function startOnlineGame() {
      if (gameState.hostId !== localPlayerId) return;
      gameState.status = 'playing';
      gameState.logs.push("🚀 Gra rozpoczęta!");
      pushRoomState();
      renderGameState();
    }

    function rollDice() {
      if (gameState.status !== 'playing') return;
      var curr = gameState.players[gameState.currentPlayerIndex];
      if (curr.id !== localPlayerId) {
        alert("To nie Twoja tura!");
        return;
      }
      if (gameState.diceRolled) {
        alert("Rzuciłeś już kośćmi!");
        return;
      }

      var d1 = Math.floor(Math.random() * 6) + 1;
      var d2 = Math.floor(Math.random() * 6) + 1;
      gameState.lastDice = [d1, d2];
      gameState.diceRolled = true;

      var oldPos = curr.position;
      curr.position = (curr.position + d1 + d2) % 40;
      if (curr.position < oldPos) {
        curr.money += 200;
        gameState.logs.push(`💰 ${curr.name} przeszedł przez START i otrzymał 200 PLN.`);
      }

      gameState.logs.push(`🎲 ${curr.name} wyrzucił ${d1} + ${d2} (${d1+d2}). Pole #${curr.position}`);

      handleTileLanding(curr);
      pushRoomState();
      renderGameState();
    }

    function handleTileLanding(player) {
      var tile = BOARD_FIELDS[player.position];
      if (!tile || tile.group === 'special') return;

      var prop = gameState.properties[tile.id];
      if (prop && prop.owner && prop.owner !== player.id) {
        var owner = gameState.players.find(function(p) { return p.id === prop.owner; });
        var rent = tile.rent * (prop.houses ? prop.houses + 1 : 1);
        player.money -= rent;
        if (owner) owner.money += rent;
        gameState.logs.push(`💸 ${player.name} płaci ${rent}zł czynszu graczowi ${owner ? owner.name : 'właściciel'}.`);
      }
    }

    function buyCurrentTile() {
      var curr = gameState.players[gameState.currentPlayerIndex];
      var tile = BOARD_FIELDS[curr.position];
      if (!tile || gameState.properties[tile.id]) return;

      if (curr.money >= tile.price) {
        curr.money -= tile.price;
        gameState.properties[tile.id] = { owner: curr.id, houses: 0 };
        gameState.logs.push(`🏠 ${curr.name} kupił ${tile.name} za ${tile.price}zł.`);
        pushRoomState();
        renderGameState();
      }
    }

    function upgradeCurrentTile() {
      var curr = gameState.players[gameState.currentPlayerIndex];
      var tile = BOARD_FIELDS[curr.position];
      var prop = gameState.properties[tile.id];
      if (!prop || prop.owner !== curr.id) return;

      var cost = Math.floor(tile.price / 2);
      if (curr.money >= cost) {
        curr.money -= cost;
        prop.houses = (prop.houses || 0) + 1;
        gameState.logs.push(`🏗️ ${curr.name} rozbudował ${tile.name} (Poziom ${prop.houses}).`);
        pushRoomState();
        renderGameState();
      }
    }

    function endTurn() {
      if (gameState.status !== 'playing') return;
      var curr = gameState.players[gameState.currentPlayerIndex];
      if (curr.id !== localPlayerId) return;

      if (!gameState.diceRolled) {
        alert("Zrób najpierw rzut kośćmi!");
        return;
      }

      gameState.diceRolled = false;
      gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
      gameState.logs.push(`⏭️ Tura gracza: ${gameState.players[gameState.currentPlayerIndex].name}`);

      pushRoomState();
      renderGameState();
    }

    window.joinRoom = joinRoom;
    window.startOnlineGame = startOnlineGame;
    window.rollDice = rollDice;
    window.endTurn = endTurn;
    window.buyCurrentTile = buyCurrentTile;
    window.upgradeCurrentTile = upgradeCurrentTile;

    window.onload = function() {
      initBoardDOM();
      renderGameState();
    };
  </script>
</body>
</html>
