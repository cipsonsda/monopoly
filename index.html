<!-- FIREBASE & ONLINE LOBBY MODULES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Setup Global Variables & Fallbacks
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'monopoly-ruda-slaska';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDummyKeyForFallbackOnly",
      authDomain: "dummy.firebaseapp.com",
      projectId: "dummy-project"
    };

    let app = null;
    let db = null;
    let auth = null;

    try {
      if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "AIzaSyDummyKeyForFallbackOnly") {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
      }
    } catch (e) {
      console.warn("Brak aktywnej konfiguracji Firebase - uruchamianie w trybie hybrydowym lokalnym.");
    }

    let currentUser = null;
    let roomCode = null;
    let roomDocRef = null;
    let unsubscribeRoom = null;
    let localPlayerId = 'usr_' + Math.random().toString(36).substring(2, 9);
    let syncChannel = null;

    const AVATARS = [
      { name: "Szyb Górniczy", emoji: "🏗️" },
      { name: "Kogut Ruda", emoji: "🐓" },
      { name: "Węglarka", emoji: "🚃" },
      { name: "Kask", emoji: "🪖" }
    ];

    // Game state structure
    let gameState = {
      status: 'waiting', // waiting, playing
      hostId: null,
      currentPlayerIndex: 0,
      diceRolled: false,
      lastDice: [1, 1],
      players: [],
      ownership: {},
      logs: [],
      activeTrade: null
    };

    if (auth) {
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        signInWithCustomToken(auth, __initial_auth_token).then(userCred => {
          currentUser = userCred.user;
          localPlayerId = currentUser.uid;
        }).catch(() => signInAnonymously(auth).then(u => {
          currentUser = u.user;
          localPlayerId = currentUser.uid;
        }));
      } else {
        signInAnonymously(auth).then(u => {
          currentUser = u.user;
          localPlayerId = currentUser.uid;
        });
      }
    }

    /* ==========================================================================
       GAME ENGINE & UTILITY FUNCTIONS
       ========================================================================== */

    function initBoardDOM() {
      // Board initialization logic
      renderGameState();
    }

    function renderGameState() {
      // Update UI matching current gameState
      const lobbyArea = document.getElementById('lobby-waiting-area');
      const gameArea = document.getElementById('game-main-area');
      
      if (gameState.status === 'playing') {
        if (lobbyArea) lobbyArea.classList.add('hidden');
        if (gameArea) gameArea.classList.remove('hidden');
      } else {
        if (lobbyArea && gameState.players.length > 0) lobbyArea.classList.remove('hidden');
        if (gameArea) gameArea.classList.add('hidden');
      }

      // Update player list in lobby
      const playerList = document.getElementById('lobby-players-list');
      if (playerList) {
        playerList.innerHTML = gameState.players.map(p => `
          <div class="flex items-center justify-between p-2 bg-slate-800 rounded border border-slate-700">
            <span class="font-bold text-amber-400">${p.avatar.emoji} ${p.name}</span>
            <span class="text-xs text-slate-400">${p.id === gameState.hostId ? '👑 Gospodarz' : 'Gracz'}</span>
          </div>
        `).join('');
      }

      // Host start button visibility
      const startBtn = document.getElementById('btn-start-game');
      if (startBtn) {
        if (gameState.hostId === localPlayerId && gameState.status === 'waiting') {
          startBtn.classList.remove('hidden');
        } else {
          startBtn.classList.add('hidden');
        }
      }
    }

    async function pushRoomState() {
      localStorage.setItem(`monopoly_room_${roomCode}`, JSON.stringify(gameState));
      if (syncChannel) {
        syncChannel.postMessage(gameState);
      }

      if (roomDocRef && db) {
        try {
          await setDoc(roomDocRef, gameState, { merge: true });
        } catch (err) {
          console.warn("Zapis w chmurze opcjonalny:", err);
        }
      }
    }

    async function rollDice() {
      if (gameState.status !== 'playing') return;
      const currPlayer = gameState.players[gameState.currentPlayerIndex];
      if (currPlayer.id !== localPlayerId) {
        alert("To nie Twoja tura!");
        return;
      }
      if (gameState.diceRolled) {
        alert("Już rzuciłeś kośćmi w tej turze!");
        return;
      }

      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      gameState.lastDice = [d1, d2];
      gameState.diceRolled = true;

      currPlayer.position = (currPlayer.position + d1 + d2) % 40;
      gameState.logs.push(`🎲 ${currPlayer.name} wyrzucił ${d1} + ${d2} = ${d1 + d2}. Prechodzi na pole #${currPlayer.position}.`);

      await pushRoomState();
      renderGameState();
    }

    async function endTurn() {
      if (gameState.status !== 'playing') return;
      const currPlayer = gameState.players[gameState.currentPlayerIndex];
      if (currPlayer.id !== localPlayerId) return;

      if (!gameState.diceRolled) {
        alert("Musisz najpierw rzucić kośćmi!");
        return;
      }

      gameState.diceRolled = false;
      gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
      const nextPlayer = gameState.players[gameState.currentPlayerIndex];
      gameState.logs.push(`⏭️ Tura gracza: ${nextPlayer.name}`);

      await pushRoomState();
      renderGameState();
    }

    function openBuyModal() {}
    function confirmBuyProperty() {}
    function closeBuyModal() {}
    function openUpgradeModal() {}
    function confirmUpgradeProperty() {}
    function closeUpgradeModal() {}
    function openTradeModal() {}
    function proposeTradeOnline() {}
    function acceptTradeOnline() {}
    function rejectTradeOnline() {}
    function closeTradeModal() {}
    function openRulesModal() {}
    function closeRulesModal() {}
    function setupTradeWindow() {}
    function selectFieldDetail() {}

    /* ==========================================================================
       ROOM & SYNC LOGIC
       ========================================================================== */

    async function joinRoom() {
      const nameInput = document.getElementById('input-player-name').value.trim();
      const codeInput = document.getElementById('input-room-code').value.trim().toUpperCase();

      if (!nameInput) {
        alert("Wpisz swój nick przed dołączeniem!");
        return;
      }
      if (!codeInput) {
        alert("Wpisz kod pokoju!");
        return;
      }

      roomCode = codeInput;
      document.getElementById('display-room-code').innerText = roomCode;
      document.getElementById('room-code-badge').classList.remove('hidden');

      // Initialize BroadcastChannel for multi-tab synchronization
      syncChannel = new BroadcastChannel(`room_${roomCode}`);
      syncChannel.onmessage = (event) => {
        gameState = event.data;
        renderGameState();
      };

      let existingRoomData = localStorage.getItem(`monopoly_room_${roomCode}`);
      let snap = null;

      if (db) {
        try {
          roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
          snap = await getDoc(roomDocRef);
        } catch (e) {
          console.log("Fallback do trybu hybrydowego");
        }
      }

      if (!existingRoomData && (!snap || !snap.exists())) {
        gameState = {
          status: 'waiting',
          hostId: localPlayerId,
          currentPlayerIndex: 0,
          diceRolled: false,
          lastDice: [1, 1],
          players: [{
            id: localPlayerId,
            name: nameInput,
            money: 1500,
            position: 0,
            inJail: false,
            avatar: AVATARS[0]
          }],
          ownership: {},
          logs: [`🎮 Pokój ${roomCode} utworzony przez ${nameInput}.`],
          activeTrade: null
        };
        await pushRoomState();
      } else {
        if (snap && snap.exists()) {
          gameState = snap.data();
        } else if (existingRoomData) {
          gameState = JSON.parse(existingRoomData);
        }

        const existingPlayer = gameState.players.find(p => p.id === localPlayerId || p.name === nameInput);
        if (!existingPlayer) {
          if (gameState.players.length >= 4) {
            alert("Pokój jest pełny (max 4 graczy)!");
            return;
          }
          if (gameState.status === 'playing') {
            alert("Gra w tym pokoju już trwa!");
            return;
          }

          const avatarIndex = gameState.players.length % AVATARS.length;
          gameState.players.push({
            id: localPlayerId,
            name: nameInput,
            money: 1500,
            position: 0,
            inJail: false,
            avatar: AVATARS[avatarIndex]
          });
          gameState.logs.push(`👋 ${nameInput} dołączył do pokoju.`);
          await pushRoomState();
        }
      }

      listenToRoom();

      document.getElementById('lobby-waiting-area').classList.remove('hidden');
      renderGameState();
    }

    function listenToRoom() {
      if (unsubscribeRoom) unsubscribeRoom();

      if (roomDocRef && db) {
        unsubscribeRoom = onSnapshot(roomDocRef, (docSnap) => {
          if (docSnap.exists()) {
            gameState = docSnap.data();
            renderGameState();
          }
        }, (err) => console.log("Odsłuch Firebase opcjonalny:", err));
      }

      setInterval(() => {
        const localData = localStorage.getItem(`monopoly_room_${roomCode}`);
        if (localData) {
          const parsed = JSON.parse(localData);
          if (JSON.stringify(parsed) !== JSON.stringify(gameState)) {
            gameState = parsed;
            renderGameState();
          }
        }
      }, 800);
    }

    async function startOnlineGame() {
      if (gameState.hostId !== localPlayerId) return;
      if (gameState.players.length < 2) {
        alert("Do rozpoczęcia gry potrzeba co najmniej 2 graczy!");
        return;
      }
      gameState.status = 'playing';
      gameState.logs.push("🚀 Gra została rozpoczęta!");
      await pushRoomState();
    }

    // Attach all interactive handlers safely to global window scope
    window.joinRoom = joinRoom;
    window.startOnlineGame = startOnlineGame;
    window.rollDice = rollDice;
    window.endTurn = endTurn;
    window.openBuyModal = openBuyModal;
    window.confirmBuyProperty = confirmBuyProperty;
    window.closeBuyModal = closeBuyModal;
    window.openUpgradeModal = openUpgradeModal;
    window.confirmUpgradeProperty = confirmUpgradeProperty;
    window.closeUpgradeModal = closeUpgradeModal;
    window.openTradeModal = openTradeModal;
    window.proposeTradeOnline = proposeTradeOnline;
    window.acceptTradeOnline = acceptTradeOnline;
    window.rejectTradeOnline = rejectTradeOnline;
    window.closeTradeModal = closeTradeModal;
    window.openRulesModal = openRulesModal;
    window.closeRulesModal = closeRulesModal;
    window.setupTradeWindow = setupTradeWindow;
    window.selectFieldDetail = selectFieldDetail;

    // Initialize board on load
    window.onload = () => {
      initBoardDOM();
    };
  </script>
</body>
</html>
