    // Stan gry
    let gameState = {
      status: 'waiting',

      currentPlayerIndex: 0,
      diceRolled: false,
      lastDice: [1, 1],
      players: [],
      ownership: {},
      logs: [],
      activeTrade: null
    };

    if (auth) {
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        signInWithCustomToken(auth, __initial_auth_token).then(userCred => {
          currentUser = userCred.user;
          localPlayerId = currentUser.uid;
        }).catch(() => signInAnonymously(auth).then(u => {
          currentUser = u.user;
          localPlayerId = currentUser.uid;
        }));
      } else {
        signInAnonymously(auth).then(u => {
          currentUser = u.user;
          localPlayerId = currentUser.uid;
        });
      }

    /* ==========================================================================
       RENDEROWANIE I LOGIKA
       ========================================================================== */

    function initBoardDOM() {
      renderGameState();
    }

    function renderGameState() {
      const lobbyArea = document.getElementById('lobby-waiting-area');
      const gameArea = document.getElementById('game-main-area');
      
      if (gameState.status === 'playing') {
        if (lobbyArea) lobbyArea.classList.add('hidden');
        if (gameArea) gameArea.classList.remove('hidden');
      } else {
        if (lobbyArea && gameState.players.length > 0) lobbyArea.classList.remove('hidden');
        if (gameArea) gameArea.classList.add('hidden');
      }

      const playerList = document.getElementById('lobby-players-list');
      if (playerList) {
        playerList.innerHTML = gameState.players.map(p => `
          <div class="flex items-center justify-between p-2 bg-slate-800 rounded border border-slate-700">
            <span class="font-bold text-amber-400">${p.avatar ? p.avatar.emoji : '👤'} ${p.name}</span>
            <span class="text-xs text-slate-400">${p.id === gameState.hostId ? '👑 Gospodarz' : 'Gracz'}</span>
          </div>
        `).join('');
      }

      const startBtn = document.getElementById('btn-start-game');
      if (startBtn) {
        if (gameState.hostId === localPlayerId && gameState.status === 'waiting') {
          startBtn.classList.remove('hidden');
        } else {
          startBtn.classList.add('hidden');
        }
      }
    }

    async function pushRoomState() {
      localStorage.setItem(`monopoly_room_${roomCode}`, JSON.stringify(gameState));
      if (syncChannel) {
        syncChannel.postMessage(gameState);
      }

      if (roomDocRef && db) {
        try {
          await setDoc(roomDocRef, gameState, { merge: true });
        } catch (err) {
          console.warn("Zapis w chmurze opcjonalny:", err);
        }
      }
    }

    async function joinRoom() {
      const nameInput = document.getElementById('input-player-name').value.trim();
      const codeInput = document.getElementById('input-room-code').value.trim().toUpperCase();

      if (!nameInput) {
        alert("Wpisz swój nick przed dołączeniem!");
        return;
      }
      if (!codeInput) {
        alert("Wpisz kod pokoju!");
        return;
      }

      roomCode = codeInput;
      const codeBadge = document.getElementById('room-code-badge');
      if (codeBadge) {
        document.getElementById('display-room-code').innerText = roomCode;
        codeBadge.classList.remove('hidden');
      }

      syncChannel = new BroadcastChannel(`room_${roomCode}`);
      syncChannel.onmessage = (event) => {
        gameState = event.data;
        renderGameState();
      };

      let existingRoomData = localStorage.getItem(`monopoly_room_${roomCode}`);
      let snap = null;

      if (db) {
        try {
          roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
          snap = await getDoc(roomDocRef);
        } catch (e) {
          console.log("Fallback do trybu lokalnego");
        }
      }

      if (!existingRoomData && (!snap || !snap.exists())) {
        gameState = {
          status: 'waiting',
          hostId: localPlayerId,
          currentPlayerIndex: 0,
          diceRolled: false,
          lastDice: [1, 1],
          players: [{
            id: localPlayerId,
            name: nameInput,
            money: 1500,
            position: 0,
            inJail: false,
            avatar: AVATARS[0]
          }],
          ownership: {},
          logs: [`🎮 Pokój ${roomCode} utworzony przez ${nameInput}.`],
          activeTrade: null
        };
        await pushRoomState();
      } else {
        if (snap && snap.exists()) {
          gameState = snap.data();
        } else if (existingRoomData) {
          gameState = JSON.parse(existingRoomData);
        }

        const existingPlayer = gameState.players.find(p => p.id === localPlayerId || p.name === nameInput);
        if (!existingPlayer) {
          if (gameState.players.length >= 4) {
            alert("Pokój jest pełny (max 4 graczy)!");
            return;
          }
          if (gameState.status === 'playing') {
            alert("Gra w tym pokoju już trwa!");
            return;
          }

          const avatarIndex = gameState.players.length % AVATARS.length;
          gameState.players.push({
            id: localPlayerId,
            name: nameInput,
            money: 1500,
            position: 0,
            inJail: false,
            avatar: AVATARS[avatarIndex]
          });
          gameState.logs.push(`👋 ${nameInput} dołączył do pokoju.`);
          await pushRoomState();
        }
      }

      listenToRoom();

      const lobbyElem = document.getElementById('lobby-waiting-area');
      if (lobbyElem) lobbyElem.classList.remove('hidden');
      renderGameState();
    }

    function listenToRoom() {
      if (unsubscribeRoom) unsubscribeRoom();

      if (roomDocRef && db) {
        unsubscribeRoom = onSnapshot(roomDocRef, (docSnap) => {
          if (docSnap.exists()) {
            gameState = docSnap.data();
            renderGameState();
          }
        }, (err) => console.log("Odsłuch opcjonalny:", err));
      }

      setInterval(() => {
        const localData = localStorage.getItem(`monopoly_room_${roomCode}`);
        if (localData) {
          const parsed = JSON.parse(localData);
          if (JSON.stringify(parsed) !== JSON.stringify(gameState)) {
            gameState = parsed;
            renderGameState();
          }
        }
      }, 800);
    }

    async function startOnlineGame() {
      if (gameState.hostId !== localPlayerId) return;
      if (gameState.players.length < 2) {
        alert("Do rozpoczęcia gry potrzeba co najmniej 2 graczy!");
        return;
      }
      gameState.status = 'playing';
      gameState.logs.push("🚀 Gra została rozpoczęta!");
      await pushRoomState();
    }

    async function rollDice() {
      if (gameState.status !== 'playing') return;
      const currPlayer = gameState.players[gameState.currentPlayerIndex];
      if (currPlayer.id !== localPlayerId) {
        alert("To nie Twoja tura!");
        return;
      }
      if (gameState.diceRolled) {
        alert("Już rzuciłeś kośćmi w tej turze!");
        return;
      }

      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      gameState.lastDice = [d1, d2];
      gameState.diceRolled = true;

      currPlayer.position = (currPlayer.position + d1 + d2) % 40;
      gameState.logs.push(`🎲 ${currPlayer.name} wyrzucił ${d1} + ${d2} = ${d1 + d2}. Przechodzi na pole #${currPlayer.position}.`);

      await pushRoomState();
      renderGameState();
    }

    async function endTurn() {
      if (gameState.status !== 'playing') return;
      const currPlayer = gameState.players[gameState.currentPlayerIndex];
      if (currPlayer.id !== localPlayerId) return;

      if (!gameState.diceRolled) {
        alert("Musisz najpierw rzucić kośćmi!");
        return;
      }

      gameState.diceRolled = false;
      gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
      const nextPlayer = gameState.players[gameState.currentPlayerIndex];
      gameState.logs.push(`⏭️ Tura gracza: ${nextPlayer.name}`);

      await pushRoomState();
      renderGameState();
    }
